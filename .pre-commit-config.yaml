repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (locked environment)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: detect-secrets
        name: Block new likely secrets
        entry: .venv/bin/detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^(uv.lock|web/package-lock.json|artifacts/.*\.png|web/public/fonts/)
