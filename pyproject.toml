[project]
name = "atlas-rag"
version = "0.1.0"
description = "An observable, tenant-isolated knowledge platform with local inference"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "sqlalchemy>=2,<3", "redis>=5,<9", "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "sentence-transformers>=3,<7", "torch>=2,<3", "ollama>=0.6,<1", "python-multipart>=0.0.20,<1",
  "langgraph>=1,<2", "mcp>=1.9,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<3", "pre-commit>=4,<5", "detect-secrets>=1.5,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# One-shot administrative scripts can synchronously read their local manifests.
"scripts/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: real PostgreSQL and Redis required", "model: local model required"]

# Linux containers use CPU wheels; macOS uses the native PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
