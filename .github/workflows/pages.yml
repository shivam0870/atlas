name: Publish project showcase
on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "artifacts/atlas-upgrade-home.png",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static showcase only
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp artifacts/atlas-upgrade-home.png _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
