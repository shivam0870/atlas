name: Verify Atlas
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.5'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 scripts/configure.py
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src
      - run: docker compose up -d postgres redis cache
      - run: uv run alembic upgrade head
      - run: uv run pytest -m 'not model' -q
      - run: npm ci && npm run build
        working-directory: web

      - name: Report corpus evaluation gate
        run: |
          python3 - <<'PYCODE'
          import json, os
          baseline=json.load(open('datasets/baseline.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Corpus quality gate: '+baseline['status']+'. Unit and integration checks do not substitute for human label review.\n')
          PYCODE
